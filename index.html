<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ePooja Scene</title>
  <style>
    /* Temple gradient (per Figma "Ready" screen) — a deep teal/sage frame with a
       warm cream-gold glow behind the deity, so the warm murti has real contrast
       against a cooler ground (fixes warm-on-warm blend). */
    html, body { margin: 0; height: 100%; overflow: hidden;
      background:
        radial-gradient(60% 44% at 50% 39%, #ffe9bd 0%, #f7ca80 23%, rgba(226,150,58,0.34) 46%, rgba(58,86,78,0) 68%),
        linear-gradient(180deg, #365149 0%, #48655c 42%, #48655c 58%, #2b453e 100%); }
    #app { position: fixed; inset: 0; z-index: 1; }
    canvas { display: block; touch-action: none; }
    /* Real hanging-diya asset (Figma 1:3461), pinned to the top corners; the right
       one is mirrored. pointer-events:none so orbit touches pass through. */
    #diya-left, #diya-right { position: fixed; top: 0; width: 16vw; max-width: 84px;
      height: auto; z-index: 2; pointer-events: none; }
    #diya-left { left: 6px; }
    #diya-right { right: 6px; transform: scaleX(-1); }
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(88% 78% at 50% 42%, rgba(0,0,0,0) 60%, rgba(14,32,27,0.34) 100%); }
    #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      color: #fff; font-family: -apple-system, Roboto, sans-serif; font-size: 14px; padding: 24px;
      text-align: center; background: rgba(60,25,5,0.62); z-index: 5; }
  </style>
</head>
<body>
  <div id="app"></div>
  <img id="diya-left" src="diya.png" alt="" />
  <img id="diya-right" src="diya.png" alt="" />
  <div id="vignette"></div>
  <div id="err"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/RGBELoader.js"></script>

  <script>
  //=====================================================================
  // ePooja immersive scene — VISUALS ONLY. Flutter conducts: it sends
  // loadMurti / addProps / cue / setOrbitEnabled / resetView / pause / resume,
  // and this page posts back sceneReady / murtiProgress / murtiLoaded /
  // propsLoaded / fpsReport / error. No audio, no clock — audio + choreography
  // live in Flutter.
  //=====================================================================
  var HDR_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/entrance_hall_2k.hdr';

  var scene, camera, renderer, controls, clock, pmrem, gltfLoader;
  var idol, halo, niche, keyLight, spotLight, ambLight;
  var diyas = [], flames = [], petals = [], flowerProto = null, flowerFallback = false, flowerTexes = null, petalTexes = null;
  var aartiLamp = null, aartiActive = false;
  var showering = false, paused = false;
  var frames = 0, _fpsT0 = 0, fpsReported = false, _lw = 0, _lh = 0;
  var texFlameCore, texEmber, texGlow;

  //--- bridge: outbound (native JS channel OR web postMessage to parent) ----
  function send(type, payload){
    var msg = { v:1, type:type }; if(payload) msg.payload = payload;
    var s = JSON.stringify(msg);
    try { if(window.AppWebBridge && window.AppWebBridge.postMessage){ window.AppWebBridge.postMessage(s); return; } } catch(e){}
    try { if(window.parent && window.parent !== window){ window.parent.postMessage(s, '*'); } } catch(e){}
  }
  function fail(m){ var e=document.getElementById('err'); e.style.display='flex'; e.textContent='Scene error: '+m; send('error',{reason:String(m)}); }

  //--- bridge: inbound. Native calls window.__appWebBridge.receive(jsonStr);
  //    web delivers app→scene via a window 'message' event (from the parent).
  function handleInbound(raw){
    var msg; try { msg = JSON.parse(raw); } catch(e){ return; }
    if(!msg || typeof msg.type !== 'string') return;
    var p = msg.payload || {};
    try{
      switch(msg.type){
        case 'loadMurti': loadMurti(p.murtiUrl); break;
        case 'addProps': addProps(p.props || []); break;
        case 'cue': onCue(p.propType, !!p.on); break;
        case 'setOrbitEnabled': if(controls){ controls.enableRotate = !!p.enabled; controls.enableZoom = !!p.enabled; } break;
        case 'resetView': resetView(); break;
        case 'pause': paused = true; break;
        case 'resume': paused = false; break;
        default: break;
      }
    }catch(err){ fail('command '+msg.type+' failed: '+(err&&err.message?err.message:err)); }
  }
  window.__appWebBridge = { receive: handleInbound };
  window.addEventListener('message', function(e){ if(typeof e.data === 'string') handleInbound(e.data); });

  // Reset the user's orbit back to the framed front view (saveState captured the
  // configured camera+target at init). Driven by the app's top-right reset button.
  function resetView(){ if(controls){ controls.reset(); } }

  //--- canvas textures (flame core, soft glow) ------------------------
  function radialTex(stops, s){ s=s||64; var c=document.createElement('canvas'); c.width=c.height=s; var g=c.getContext('2d');
    var grd=g.createRadialGradient(s/2,s/2,1,s/2,s/2,s/2); for(var i=0;i<stops.length;i++) grd.addColorStop(stops[i][0],stops[i][1]);
    g.fillStyle=grd; g.fillRect(0,0,s,s); return new THREE.CanvasTexture(c); }
  function flameTex(){ var c=document.createElement('canvas'); c.width=64; c.height=96; var g=c.getContext('2d');
    var grd=g.createLinearGradient(32,92,32,4);
    grd.addColorStop(0,'rgba(255,110,20,0)'); grd.addColorStop(0.16,'rgba(255,140,30,0.85)');
    grd.addColorStop(0.46,'rgba(255,200,80,1)'); grd.addColorStop(0.74,'rgba(255,248,224,1)'); grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.beginPath(); g.moveTo(32,3); g.bezierCurveTo(58,44,50,92,32,92); g.bezierCurveTo(14,92,6,44,32,3); g.fill();
    return new THREE.CanvasTexture(c); }

  function makeFlame(parent,x,y,z,size){
    var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:texEmber,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.5}));
    glow.scale.set(size*3.4,size*3.4,1); glow.position.set(x,y+size*0.4,z); parent.add(glow);
    var core=new THREE.Sprite(new THREE.SpriteMaterial({map:texFlameCore,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    core.center.set(0.5,0.0); core.scale.set(size,size*2.1,1); core.position.set(x,y,z); parent.add(core);
    var f={core:core,glow:glow,x:x,base:size,seed:Math.random()*10}; flames.push(f); return f;
  }
  function updateFlames(t){
    for(var i=0;i<flames.length;i++){ var f=flames[i];
      var n=Math.sin(t*12+f.seed)*0.14+Math.sin(t*29+f.seed*1.7)*0.07;
      f.core.scale.set(f.base*(1+n*0.5), f.base*2.1*(1+n), 1);
      f.core.material.opacity=0.85+n; var g=f.base*3.4*(1+n*0.3); f.glow.scale.set(g,g,1); f.glow.material.opacity=0.38+Math.abs(n)*1.2;
    }
  }

  //--- flower textures (vivid 2D marigold + rose, drawn on canvas) -----
  // Canvas colours are sRGB; tag the texture so it isn't double-lightened to a
  // pale wash under the renderer's sRGB output (the fix for washed-out flowers).
  function srgb(t){ t.anisotropy=4; if(THREE.sRGBEncoding!==undefined) t.encoding=THREE.sRGBEncoding; return t; }
  function marigoldTex(outer, mid, inner){
    var s=128, cv=document.createElement('canvas'); cv.width=cv.height=s; var g=cv.getContext('2d'); var cx=64, cy=64;
    g.fillStyle=outer; g.beginPath(); g.arc(cx,cy,47,0,Math.PI*2); g.fill();   // solid base so it reads as a full bloom at small size
    var rings=[[47,22,outer],[36,18,mid],[24,14,inner],[12,10,inner]];
    for(var r=0;r<rings.length;r++){ var rad=rings[r][0], n=rings[r][1]; g.fillStyle=rings[r][2];
      for(var i=0;i<n;i++){ var a=(i/n)*Math.PI*2 + r*0.4;
        var px=cx+Math.cos(a)*rad*0.62, py=cy+Math.sin(a)*rad*0.62;
        g.save(); g.translate(px,py); g.rotate(a+Math.PI/2);
        g.beginPath(); g.ellipse(0,0,rad*0.2,rad*0.36,0,0,Math.PI*2); g.fill(); g.restore(); } }
    g.fillStyle=inner; g.beginPath(); g.arc(cx,cy,10,0,Math.PI*2); g.fill();
    return srgb(new THREE.CanvasTexture(cv));
  }
  function roseTex(){
    var s=128, cv=document.createElement('canvas'); cv.width=cv.height=s; var g=cv.getContext('2d'); var cx=64,cy=64;
    g.fillStyle='#e14f7c'; g.beginPath(); g.arc(cx,cy,44,0,Math.PI*2); g.fill();
    var layers=[[44,'#e14f7c'],[31,'#f26f95'],[18,'#ff9ab6']];
    for(var r=0;r<layers.length;r++){ var rad=layers[r][0]; g.fillStyle=layers[r][1]; var n=6;
      for(var i=0;i<n;i++){ var a=(i/n)*Math.PI*2 + r*0.5;
        var px=cx+Math.cos(a)*rad*0.5, py=cy+Math.sin(a)*rad*0.5;
        g.save(); g.translate(px,py); g.rotate(a+Math.PI/2);
        g.beginPath(); g.ellipse(0,0,rad*0.36,rad*0.48,0,0,Math.PI*2); g.fill(); g.restore(); } }
    g.fillStyle='#c23c63'; g.beginPath(); g.arc(cx,cy,8,0,Math.PI*2); g.fill();
    return srgb(new THREE.CanvasTexture(cv));
  }
  function buildFlowerTexes(){ if(flowerTexes) return flowerTexes;
    flowerTexes=[ marigoldTex('#d95f00','#f5820a','#ffbb28'),
                  marigoldTex('#e8700a','#ffab1a','#ffdb54'),
                  roseTex() ];
    return flowerTexes; }
  // individual loose petals (as in the original demo) — a single teardrop petal
  function petalTex(edge, mid){
    var w=64,h=100, cv=document.createElement('canvas'); cv.width=w; cv.height=h; var g=cv.getContext('2d');
    var grd=g.createLinearGradient(32,98,32,4); grd.addColorStop(0,edge); grd.addColorStop(0.55,mid); grd.addColorStop(1,edge);
    g.fillStyle=grd; g.beginPath(); g.moveTo(32,4); g.bezierCurveTo(61,38,55,98,32,98); g.bezierCurveTo(9,98,3,38,32,4); g.fill();
    g.strokeStyle='rgba(255,255,255,0.22)'; g.lineWidth=2; g.beginPath(); g.moveTo(32,15); g.lineTo(32,88); g.stroke();
    return srgb(new THREE.CanvasTexture(cv));
  }
  function buildPetalTexes(){ if(petalTexes) return petalTexes;
    petalTexes=[ petalTex('#d95f00','#ffb52a'),   // marigold petal
                 petalTex('#c2185b','#ff8fb0'),   // rose petal
                 petalTex('#b71c1c','#ff6f5a') ]; // red petal
    return petalTexes; }

  //--- geometry helpers ----------------------------------------------
  function fitInto(obj,size){ obj.updateMatrixWorld(true); var b=new THREE.Box3().setFromObject(obj); var s=b.getSize(new THREE.Vector3());
    var md=Math.max(s.x,s.y,s.z)||1; obj.scale.setScalar(size/md); obj.updateMatrixWorld(true);
    b=new THREE.Box3().setFromObject(obj); var c=b.getCenter(new THREE.Vector3()); obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=b.min.y; }
  function frameModel(obj){ obj.updateMatrixWorld(true); var box=new THREE.Box3().setFromObject(obj); var size=box.getSize(new THREE.Vector3());
    var maxDim=Math.max(size.x,size.y,size.z)||1; obj.scale.setScalar(2.4/maxDim); obj.updateMatrixWorld(true);
    box=new THREE.Box3().setFromObject(obj); var c=box.getCenter(new THREE.Vector3()); obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=(box.min.y+0.95); }
  function disposeObject(root){ root.traverse(function(o){ if(o.geometry&&o.geometry.dispose) o.geometry.dispose();
    var m=o.material; if(m){ (Array.isArray(m)?m:[m]).forEach(function(mat){ for(var k in mat){ var v=mat[k]; if(v&&v.isTexture&&v.dispose) v.dispose(); } if(mat.dispose) mat.dispose(); }); } }); }

  //--- commands -------------------------------------------------------
  function loadMurti(url){
    var eo=document.getElementById('err'); eo.style.display='none'; eo.textContent='';   // clear a prior error so a retry isn't hidden
    if(!url){ fail('loadMurti: missing url'); return; }
    gltfLoader.load(url, function(g){
      if(idol){ scene.remove(idol); disposeObject(idol); }                                 // free the previous idol's GPU resources
      idol=g.scene;
      idol.traverse(function(o){ if(o.isMesh){ o.frustumCulled=false; var m=o.material; if(m){ (Array.isArray(m)?m:[m]).forEach(function(mat){ mat.envMapIntensity=1.15; }); } } });
      frameModel(idol); scene.add(idol);
      send('murtiLoaded');
    }, function(xhr){ if(xhr && xhr.total){ send('murtiProgress',{pct:Math.round(xhr.loaded/xhr.total*100)}); } },
       function(){ fail('murti load failed'); });
  }

  function addProps(props){
    var pending = props.length; if(!pending){ send('propsLoaded'); return; }
    var done = function(){ if(--pending<=0) send('propsLoaded'); };
    for(var i=0;i<props.length;i++){ (function(prop){
      if(!prop || !prop.url){ done(); return; }
      gltfLoader.load(prop.url, function(g){
        try{
          if(prop.type==='lamp'){ placeDiyas(g.scene); placeAarti(g.scene); }
          else if(prop.type==='flower'){ flowerProto=g.scene; }
        } finally { done(); }   // complete even if a handler throws, so propsLoaded can't hang
      }, undefined, function(){
        // A prop GLB that fails to load (the backend's cue assets currently 403) falls back to a
        // hosted/procedural prop so the ritual still shows its diyas/aarti/petals. When the backend
        // serves real, public prop GLBs the success path above takes over and this never runs.
        try{
          if(prop.type==='lamp'){
            gltfLoader.load('props/lamp.glb', function(g){ placeDiyas(g.scene); }, undefined, function(){});
            gltfLoader.load('props/thali.glb', function(g){ placeAarti(g.scene); }, undefined, function(){});
          } else if(prop.type==='flower'){
            flowerFallback = true;   // no flower GLB → shower vivid canvas-drawn marigolds/roses
          }
        } finally { done(); }   // the ritual must not block on a missing prop
      });
    })(props[i]); }
  }

  // lamp → two lit diyas RESTING at the base of the pedestal, one each side,
  // always lit (never off). The lamp GLB ships its own (static) flame — hide it
  // so we render exactly one animated flame per diya.
  function placeDiyas(model){
    var spots=[[-0.72,1.42],[0.72,1.42]];   // [x, z] — in FRONT of the pedestal (its base r≈1.35 so z must clear it, else they clip into it), still on-screen (portrait FOV is narrow)
    for(var i=0;i<spots.length;i++){ var grp=new THREE.Group(); grp.position.set(spots[i][0],-1.2,spots[i][1]);
      var m=model.clone(true);
      m.traverse(function(o){ if(o.name && /flame|wick|fire|agni/i.test(o.name)) o.visible=false; }); // drop the GLB's own flame; we add one
      fitInto(m,0.46); grp.add(m);
      var light=new THREE.PointLight(0xffa542,1.7,4.5); light.position.set(0,0.28,0.12); grp.add(light);
      var bb=new THREE.Box3().setFromObject(m); makeFlame(grp,0,bb.max.y*0.86,0.02,0.07);
      scene.add(grp); diyas.push({grp:grp,light:light,seed:Math.random()*10}); }
  }
  function updateDiyas(t){ for(var i=0;i<diyas.length;i++){ var d=diyas[i]; d.light.intensity=1.4+Math.sin(t*11+d.seed)*0.4+Math.sin(t*27+d.seed)*0.2; } }

  // lamp → also the aarti: a lit thali (aarti_thali.glb has no usable flame, so
  // it rides beneath a standalone flame) that circles the murti's face while the
  // lamp cue is active. Hidden until the cue turns it on.
  function placeAarti(model){
    aartiLamp = new THREE.Group();
    var m = model.clone(true); fitInto(m, 0.5); aartiLamp.add(m);
    var light = new THREE.PointLight(0xffb050, 2.0, 5); light.position.set(0, 0.3, 0.15); aartiLamp.add(light);
    var bb = new THREE.Box3().setFromObject(m); makeFlame(aartiLamp, 0, bb.max.y * 0.9, 0.05, 0.09);
    aartiLamp.visible = false; scene.add(aartiLamp);
  }
  // slow, dignified clockwise circle in front of the deity's face.
  function updateAarti(t){
    if(!aartiLamp) return;
    aartiLamp.visible = aartiActive;
    if(!aartiActive) return;
    var a = -t * 0.9;               // clockwise
    var r = 0.95;
    aartiLamp.position.set(Math.cos(a) * r, 0.55 + Math.sin(a) * r * 0.5, 1.15);
    aartiLamp.rotation.y = Math.sin(t) * 0.3;
  }

  function onCue(propType, on){
    if(propType==='flower'){ showering = on; }
    // lamp stays lit (diyas, never extinguished) AND performs the aarti — the
    // lamp/thali circles the murti while its cue is active.
    if(propType==='lamp'){ aartiActive = on; }
  }

  // flower shower — clones of the real flower GLB when available, else a pool of
  // vivid canvas-drawn marigold/rose planes that tumble as they fall.
  function ensurePetalPool(){
    if(petals.length) return;
    if(flowerProto){
      for(var i=0;i<16;i++){ var m=flowerProto.clone(true); fitInto(m,0.16); m.visible=false; scene.add(m); petals.push(mkPetal(m)); }
      return;
    }
    if(!flowerFallback) return;
    var fl=buildFlowerTexes(), pt=buildPetalTexes();
    for(var j=0;j<30;j++){
      // toneMapped:false so ACES doesn't wash the vivid colours toward pale
      var pl;
      if(j%5<2){   // ~40% whole blooms (marigold/rose)
        var sz=0.36+Math.random()*0.12;
        var mf=new THREE.MeshBasicMaterial({map:fl[j%fl.length],transparent:true,alphaTest:0.35,side:THREE.DoubleSide,toneMapped:false});
        pl=new THREE.Mesh(new THREE.PlaneGeometry(sz,sz),mf);
      } else {     // ~60% loose petals (as in the original demo)
        var pw=0.13+Math.random()*0.05;
        var mp=new THREE.MeshBasicMaterial({map:pt[j%pt.length],transparent:true,alphaTest:0.3,side:THREE.DoubleSide,toneMapped:false});
        pl=new THREE.Mesh(new THREE.PlaneGeometry(pw,pw*1.7),mp);
      }
      pl.visible=false; scene.add(pl); petals.push(mkPetal(pl));
    }
  }
  function mkPetal(o){ return {o:o,vy:0,sway:Math.random()*6.28,sp:0.5+Math.random(),spin:(Math.random()-0.5)*2.4}; }
  function spawnPetal(){ for(var i=0;i<petals.length;i++){ var p=petals[i]; if(!p.o.visible){
    p.o.position.set((Math.random()-0.5)*3.4,3.3+Math.random()*1.1,(Math.random()-0.5)*1.5);
    p.vy=0.7+Math.random()*0.7; p.o.visible=true; return; } } }
  function updatePetals(dt){ for(var i=0;i<petals.length;i++){ var p=petals[i]; if(!p.o.visible) continue;
    p.sway+=dt*p.sp; p.o.position.y-=p.vy*dt; p.o.position.x+=Math.sin(p.sway)*dt*0.5;
    p.o.rotation.z+=p.spin*dt; p.o.rotation.x+=p.spin*0.55*dt;   // tumble like a real falling flower
    if(p.o.position.y<-2.7) p.o.visible=false; } }

  //--- decoration: hanging diyas are the real Figma PNG (diya.png), placed as
  //    #diya-left / #diya-right HTML overlays — no canvas drawing needed.

  //--- decoration: arched golden niche glow behind the deity ----------
  function nicheTex(){
    var w=256, h=340, cv=document.createElement('canvas'); cv.width=w; cv.height=h; var g=cv.getContext('2d');
    var cx=w/2, archR=w*0.42, bodyTop=h*0.30;
    g.beginPath(); g.moveTo(cx-archR,h); g.lineTo(cx-archR,bodyTop);
    g.arc(cx,bodyTop,archR,Math.PI,0); g.lineTo(cx+archR,h); g.closePath();
    var grd=g.createRadialGradient(cx,h*0.5,10,cx,h*0.52,w*0.62);
    grd.addColorStop(0,'rgba(255,242,208,0.96)'); grd.addColorStop(0.5,'rgba(255,201,120,0.55)'); grd.addColorStop(1,'rgba(240,150,60,0)');
    g.fillStyle=grd; g.fill();
    g.strokeStyle='rgba(214,164,74,0.5)'; g.lineWidth=6; g.stroke();
    return new THREE.CanvasTexture(cv);
  }

  //--- lifecycle ------------------------------------------------------
  function init(){
    if(typeof THREE==='undefined'){ fail('three.js failed to load'); return; }
    try{
      var app=document.getElementById('app');
      renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(window.innerWidth,window.innerHeight);
      renderer.setClearColor(0x000000,0);
      renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
      app.appendChild(renderer.domElement);   // MANDATORY — without this the canvas renders off-DOM

      scene=new THREE.Scene();
      camera=new THREE.PerspectiveCamera(42,window.innerWidth/window.innerHeight,0.1,100);
      camera.position.set(0,0.5,7.4);

      try{ pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
        new THREE.RGBELoader().load(HDR_URL,function(hdr){ hdr.mapping=THREE.EquirectangularReflectionMapping;
          scene.environment=pmrem.fromEquirectangular(hdr).texture; hdr.dispose(); }); }catch(e){}

      ambLight=new THREE.AmbientLight(0xffe6c0,0.20); scene.add(ambLight);
      keyLight=new THREE.DirectionalLight(0xffe0b0,0.65); keyLight.position.set(1.5,3.5,3); scene.add(keyLight);
      var rim=new THREE.DirectionalLight(0xffcaa0,0.4); rim.position.set(-3,2,-2.5); scene.add(rim);
      spotLight=new THREE.SpotLight(0xfff2d2,1.55,16,Math.PI*0.24,0.6,1.0); spotLight.position.set(0,4.6,3.6); spotLight.target.position.set(0,0.1,0); scene.add(spotLight); scene.add(spotLight.target);
      var back=new THREE.DirectionalLight(0xffdca6,2.2); back.position.set(0,2.6,-4); scene.add(back);

      texGlow=radialTex([[0,'rgba(255,214,140,0.95)'],[0.5,'rgba(255,160,60,0.28)'],[1,'rgba(255,140,40,0)']],128);
      texEmber=radialTex([[0,'rgba(255,190,90,0.95)'],[0.4,'rgba(255,130,40,0.42)'],[1,'rgba(255,110,30,0)']]);
      texFlameCore=flameTex();

      // arched niche glow (temple shrine backdrop) — camera-facing, so it reads in portrait
      niche=new THREE.Sprite(new THREE.SpriteMaterial({map:nicheTex(),transparent:true,depthWrite:false,opacity:0.9}));
      niche.scale.set(5.4,7.2,1); niche.position.set(0,0.55,-1.7); scene.add(niche);
      // tight divine halo right behind the deity
      halo=new THREE.Sprite(new THREE.SpriteMaterial({map:texGlow,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.62}));
      halo.scale.set(4.6,4.6,1); halo.position.set(0,0.85,-1.4); scene.add(halo);

      var base=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.35,0.35,48), new THREE.MeshStandardMaterial({color:0x5a3a1c,metalness:0.15,roughness:0.8}));
      base.position.y=-1.15; scene.add(base);
      var prim=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.12,48), new THREE.MeshStandardMaterial({color:0xc79a44,metalness:0.55,roughness:0.32}));
      prim.position.y=-0.95; scene.add(prim);

      gltfLoader=new THREE.GLTFLoader();
      try{ var _d=new THREE.DRACOLoader(); _d.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/'); gltfLoader.setDRACOLoader(_d); }catch(e){}

      controls=new THREE.OrbitControls(camera,renderer.domElement);
      controls.enableZoom=true; controls.minDistance=4.5; controls.maxDistance=9.5;   // pinch-zoom enabled (per design), bounded
      controls.enablePan=false; controls.enableRotate=true; controls.enableDamping=true; controls.dampingFactor=0.08;
      controls.autoRotate=false; controls.target.set(0,0.05,0);
      controls.minPolarAngle=Math.PI*0.30; controls.maxPolarAngle=Math.PI*0.58;
      controls.minAzimuthAngle=-Math.PI*0.42; controls.maxAzimuthAngle=Math.PI*0.42;   // look around the sides, stay presentable
      controls.saveState();   // capture this framed view so resetView() can restore it

      // Tap-to-toggle the app chrome: the WebView owns touch events (Flutter can't
      // see them), so detect a quick tap here — minimal movement + short duration,
      // i.e. NOT an orbit drag — and report it to Flutter.
      var _tapX=0, _tapY=0, _tapDown=0;
      renderer.domElement.addEventListener('pointerdown', function(e){ _tapX=e.clientX; _tapY=e.clientY; _tapDown=performance.now(); });
      renderer.domElement.addEventListener('pointerup', function(e){
        if(Math.abs(e.clientX-_tapX)<10 && Math.abs(e.clientY-_tapY)<10 && (performance.now()-_tapDown)<350){ send('screenTapped'); }
      });
      window.addEventListener('resize',onResize);
      clock=new THREE.Clock(); animate();
      send('sceneReady');

      // Standalone browser self-test: ?murti=<url> loads a model + starts a shower.
      var q=new URLSearchParams(location.search); var mu=q.get('murti');
      if(mu){ loadMurti(mu); flowerFallback=true; showering=true;
        addProps([{type:'lamp',url:'props/lamp.glb'}]); setTimeout(function(){ aartiActive=true; }, 400); }
    }catch(e){ fail(e&&e.message?e.message:e); }
  }

  function onResize(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }

  function animate(){
    requestAnimationFrame(animate);
    if(renderer && window.innerHeight>0 && (window.innerWidth!==_lw || window.innerHeight!==_lh)){ _lw=window.innerWidth; _lh=window.innerHeight; onResize(); }  // self-heal 0-size canvas
    var dt=clock?Math.min(clock.getDelta(),0.05):0.016; var t=performance.now()*0.001;
    if(!paused){
      if(controls) controls.update();
      if(idol) idol.rotation.y=-Math.PI/2+Math.sin(t*0.45)*0.2;   // front-facing gentle sway (per-model orientation may need tuning)
      updateFlames(t); updateDiyas(t); updateAarti(t);
      if(showering){ ensurePetalPool(); if(Math.random()<dt*30) spawnPetal(); }
      updatePetals(dt);
      if(halo) halo.material.rotation+=dt*0.04;
    }
    if(renderer&&scene&&camera) renderer.render(scene,camera);
    if(!fpsReported){ if(!_fpsT0) _fpsT0=performance.now(); frames++; var _el=(performance.now()-_fpsT0)/1000; if(_el>2){ fpsReported=true; send('fpsReport',{avg:Math.round(frames/_el)}); } }
  }

  if(document.readyState!=='loading') setTimeout(init,0); else window.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
